# Local stack: MongoDB plus the API, seeded on first run.
#
#   docker compose up --build
#
# The API is then on http://localhost:8082 and its docs on /api/docs.
# Point the frontend at it with VITE_BACKEND_ENDPOINT, or leave the frontend's
# Vite proxy pointing at 8082 as it already does.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: production
      PORT: 8082
      MONGODB_URI: mongodb://mongo:27017/qtrip
      # Development-only values. A real deploy supplies its own.
      JWT_ACCESS_SECRET: local-compose-access-secret-not-for-production
      JWT_REFRESH_SECRET: local-compose-refresh-secret-not-for-production
      CORS_ORIGINS: http://localhost:8081,http://localhost:5173
    depends_on:
      mongo:
        # Waiting for the healthcheck, not just for the container to exist —
        # the API connects before it listens and would exit against a mongod
        # that is still starting up.
        condition: service_healthy

  # Runs once to populate the database, then exits.
  seed:
    build: .
    command: ["node", "dist/seed/seed.js"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/qtrip
      JWT_ACCESS_SECRET: local-compose-access-secret-not-for-production
      JWT_REFRESH_SECRET: local-compose-refresh-secret-not-for-production
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

volumes:
  mongo-data:
